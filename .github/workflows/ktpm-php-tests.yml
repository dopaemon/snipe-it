name: KTPM - PHP Tests Runner

on:
  push:
    branches:
      - master
      - develop
      - 'ktpm/**'
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/ktpm-php-tests.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/ktpm-php-tests.yml'
  workflow_dispatch:

jobs:
  run-php-tests:
    name: Run PHPUnit Tests (PHP 8.4 & SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, curl, zip, gd, bcmath
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Environment Files
        run: |
          cp -v .env.testing.example .env
          cp -v .env.testing.example .env.testing
          mkdir -p database storage/logs bootstrap/cache
          touch database/database.sqlite
          chmod -R 777 storage bootstrap/cache

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts -q

      - name: Generate Application Key
        run: php artisan key:generate --env=testing

      - name: Setup Passport Keys
        run: php artisan passport:keys --force || true

      - name: Run Core PHP Unit Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          APP_ENV: testing
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          echo "Executing PHPUnit on core test suites..."
          ./vendor/bin/phpunit --testsuite=Unit --stop-on-failure=false || php artisan test --testsuite=Unit

      - name: Archive Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-test-logs
          path: storage/logs/
          if-no-files-found: ignore
